name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for frontend changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Mirrors oxlint/oxfmt's scope (including src-tauri's JSON configs)
          # plus everything pnpm build reads.
          filters: |
            frontend:
              - '.github/workflows/ci.yml'
              - '.npmrc'
              - 'index.html'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'public/**'
              - 'src/**'
              - '*.{cjs,css,js,json,jsx,mjs,toml,ts,tsx}'
              - '**/*.{cjs,css,js,json,jsx,mjs,toml,ts,tsx}'
      - if: steps.changes.outputs.frontend == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changes.outputs.frontend == 'true'
        # --ignore-scripts skips the `prepare` lifecycle, which installs
        # lefthook's git hooks. CI has no use for them.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: steps.changes.outputs.frontend == 'true'
        run: pnpm lint
      - if: steps.changes.outputs.frontend == 'true'
        run: pnpm fmt:check
      - if: steps.changes.outputs.frontend == 'true'
        run: pnpm test
      - if: steps.changes.outputs.frontend == 'true'
        run: pnpm build

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for Rust changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - 'src-tauri/**'
      - if: steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        # Pinning by SHA drops the per-branch default the `@stable` ref would
        # have supplied, so the toolchain must be named explicitly.
        with:
          toolchain: stable
      - if: steps.changes.outputs.rust == 'true'
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - if: steps.changes.outputs.rust == 'true'
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - if: steps.changes.outputs.rust == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
